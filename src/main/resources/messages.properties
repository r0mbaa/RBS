# В сообщениях с аргументами одинарная кавычка пишется двумя: ''{0}''

BK0001=Бронь с id {0} не найдена
BK0002=Комната {0} уже забронирована на это время
BK0003=Время окончания должно быть строго позже времени начала

VA0001=Ошибка валидации
VA0002=Некорректный запрос

SY0001=Внутренняя ошибка сервера
SY0002=Запрос не может быть обработан
